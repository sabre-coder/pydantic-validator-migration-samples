name: Validate three free samples

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/**'
      - 'tests/**'
      - 'rules.json'
      - 'requirements-v*.txt'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'tests/**'
      - 'rules.json'
      - 'requirements-v*.txt'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  examples:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        line: ['1', '2']
    env:
      PYDANTIC_LINE: ${{ matrix.line }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Record source and interpreter
        run: |
          git rev-parse HEAD
          python --version
      - name: Install one pinned runtime on the disposable runner
        run: |
          python -m pip install --only-binary=:all: -r "requirements-v${PYDANTIC_LINE}.txt"
      - name: Run the 12 behavior checks for this version
        run: python -m unittest discover -s tests -v
